# Builds Paintbooth on GitHub's machines.
#
#  * every push / pull request: lint, type-check and test with coverage (Linux), then build the
#    installer (Windows; download it from the run's "Artifacts" box to try it)
#  * pushing a version tag such as v0.10.0: the same, then sign Setup.exe through SignPath (once it
#    is set up, see RELEASING.md) and publish a GitHub release with the installer, the portable zip,
#    the source zip (which includes the offline wheels for install.bat) and the documentation zip
#
# Signing is skipped automatically until the SIGNPATH_API_TOKEN secret exists.
#
# Supply chain: actions are pinned to full commit SHAs (the version is in the comment; update both
# together), and every Python package comes from requirements-dev.txt or
# wheels/requirements-offline.txt with --require-hashes. Only the release job may write.

name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Tools (pinned, hash-checked)
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy

      - name: Tests with coverage (paintbooth core, at least 80 %)
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report --fail-under=80

      - name: Generated documentation is up to date
        run: python tools/gen_docs.py --check --no-api

  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Python 3.13 (also bundled inside Paintbooth)
        id: py
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Build tools (pinned, hash-checked)
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Offline wheels (not in git; hash-checked against wheels/requirements-offline.txt)
        shell: bash
        run: |
          # numpy 2.5.3 has no cp311 wheel, so a complete offline set exists for 3.12-3.14
          for v in 3.12 3.13 3.14; do
            python -m pip download --only-binary=:all: --no-deps --platform win_amd64 \
              --python-version "$v" --require-hashes -r wheels/requirements-offline.txt -d wheels
          done

      - name: Version
        id: version
        shell: bash
        run: |
          # paintbooth/__init__.py is the only place the version is written; pyproject.toml reads it
          # from there ([tool.setuptools.dynamic]).
          v=$(python -c "import paintbooth; print(paintbooth.__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match __version__ $v (paintbooth/__init__.py)"
            exit 1
          fi
          if ! grep -q '^dynamic = \["version"\]' pyproject.toml; then
            echo "::error::pyproject.toml must read the version dynamically from paintbooth/__init__.py"
            exit 1
          fi

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Build installer, portable zip and source zip
        shell: bash
        run: python installer/build_installer.py --python "${{ env.pythonLocation }}" --out dist --source-zip

      - name: Build the documentation (HTML API reference) and zip it
        shell: bash
        run: |
          python tools/gen_docs.py
          python -c "import shutil, paintbooth; shutil.make_archive(f'dist/Paintbooth {paintbooth.__version__} docs', 'zip', '.', 'docs')"

      - name: Upload (unsigned)
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paintbooth-${{ steps.version.outputs.version }}
          path: |
            dist/Paintbooth Setup *.exe
            dist/Paintbooth * portable.zip
          if-no-files-found: error

      - name: Upload the source zip (kept out of the signing request)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paintbooth-${{ steps.version.outputs.version }}-source
          path: |
            dist/Paintbooth * source.zip
            dist/Paintbooth * docs.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      actions: read # let SignPath fetch the build artifact
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download the build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: paintbooth-${{ needs.build.outputs.version }}
          path: unsigned

      - name: Download the source zip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: paintbooth-${{ needs.build.outputs.version }}-source
          path: source

      - name: Sign Setup.exe (SignPath)
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'paintbooth' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 .github/release_notes.py "$VERSION" > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          files=unsigned
          if [ -d signed ]; then files=signed; echo "Publishing the signed build"; fi
          gh release create "v$VERSION" "$files"/* source/* --repo "$GITHUB_REPOSITORY" \
            --title "Paintbooth $VERSION" --notes-file notes.md
